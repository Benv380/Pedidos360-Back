spring.application.name=pedidos-service
server.port=8081

# Base de datos (H2 en memoria para desarrollo local; reemplazar por las
# propiedades de la base de datos cloud cuando se despliegue en AWS)
spring.datasource.url=jdbc:h2:mem:pedidos360
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true

# Microsoft Entra External ID - tenant "Pedidos360 Clientes"
# OJO: el issuer real de los tokens usa el Tenant ID como subdominio
# (verificado contra el endpoint de discovery), no el nombre amigable del dominio.
azure.ad.issuer-uri=https://427c54e7-25d1-4e62-a9c9-bca65706d07f.ciamlogin.com/427c54e7-25d1-4e62-a9c9-bca65706d07f/v2.0
azure.ad.audiences=d5ea1b90-01aa-4b17-a271-b5440afd6520,api://d5ea1b90-01aa-4b17-a271-b5440afd6520

# Origen permitido para CORS (frontend Angular local)
app.cors.allowed-origin=http://localhost:4200
